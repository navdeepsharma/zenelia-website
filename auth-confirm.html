<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmed — Zenelia</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Jost', sans-serif; background: #F7F3EE; color: #1C3A2E; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card {
      text-align: center;
      padding: 60px 40px;
      max-width: 440px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      line-height: 1.7;
      color: #5C6E66;
      margin-bottom: 24px;
    }
    .check {
      width: 64px;
      height: 64px;
      background: #5BA890;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #FDFBF8;
      font-size: 28px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Email confirmed</h1>
    <p>Your email has been verified. You can now open the Zenelia app and sign in to your account.</p>
  </div>
</body>
</html>
